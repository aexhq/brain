[workspace]
members = ["crates/brain-protocol", "crates/brain", "crates/brain-aws", "crates/brain-bench", "crates/brain-component-host", "crates/brain-loophost", "crates/brain-providers", "crates/brain-standalone", "crates/brain-server"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"

[workspace.dependencies]
# Brain owns its public session API and the Brain↔Environment wire protocol.
brain-protocol = { path = "crates/brain-protocol" }
brain = { path = "crates/brain" }
brain-aws = { path = "crates/brain-aws" }
brain-providers = { path = "crates/brain-providers" }
brain-server = { path = "crates/brain-server" }
brain-standalone = { path = "crates/brain-standalone" }
brain-loophost = { path = "crates/brain-loophost" }

anyhow = "1"
aes-gcm = "0.10"
async-trait = "0.1"
async-stream = "0.3"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "credentials-process", "default-https-client", "rt-tokio", "sso"] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
globset = "0.4"
hex = "0.4"
jsonschema = { version = "0.49", default-features = false }
libc = "0.2"
rand = "0.9"
regex = "1"
regress = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "http2"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
wasmtime = { version = "48", default-features = false, features = ["component-model", "async", "cranelift", "parallel-compilation", "runtime", "cache", "std"] }
wasmtime-wasi = "48"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "signal"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
walkdir = "2"
zeroize = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
