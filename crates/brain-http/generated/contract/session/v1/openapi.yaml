components:
  schemas:
    AdmissionStatus:
      enum:
      - admitted
      - rejected
      type: string
    AgentloopAdmission:
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
        id:
          $ref: '#/components/schemas/AgentloopId'
        status:
          $ref: '#/components/schemas/AdmissionStatus'
      required:
      - id
      - status
      type: object
    AgentloopId:
      pattern: ^[0-9a-f]{64}$
      type: string
    AgentloopRef:
      additionalProperties: false
      description: |-
        The admitted Agentloop a session runs: which one, how it is configured, which
        Environment of the session runs it.
      properties:
        configuration: true
        environment:
          $ref: '#/components/schemas/EnvironmentName'
        implementation: true
      required:
      - implementation
      - configuration
      - environment
      type: object
    ApiError:
      properties:
        code:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          type: string
        details: true
        message:
          maxLength: 4096
          minLength: 1
          type: string
        retryable:
          type: boolean
      required:
      - code
      - message
      - retryable
      type: object
    ContentBlock:
      oneOf:
      - additionalProperties: false
        properties:
          text:
            type: string
          type:
            const: text
            type: string
        required:
        - type
        - text
        type: object
      - additionalProperties: false
        properties:
          type:
            const: image
            type: string
          url:
            description: HTTPS URL fetched by the model provider.
            type: string
        required:
        - type
        - url
        type: object
      - additionalProperties: false
        properties:
          media_type:
            $ref: '#/components/schemas/FileMediaType'
          type:
            const: file
            type: string
          url:
            type: string
        required:
        - type
        - media_type
        - url
        type: object
      - additionalProperties: false
        properties:
          data: true
          format:
            description: Versioned adapter format; incompatible adapters must reject the item.
            type: string
          type:
            const: native
            type: string
        required:
        - type
        - format
        - data
        type: object
      - additionalProperties: false
        properties:
          id:
            type: string
          input: true
          name:
            type: string
          type:
            const: tool_use
            type: string
        required:
        - type
        - id
        - name
        - input
        type: object
      - additionalProperties: false
        properties:
          content: true
          is_error:
            description: |-
              ALWAYS set on a failed tool. Omitting the flag on a failure lets the
              model read that failure as a success.
            type: boolean
          media:
            description: Model-visible media alongside the ordinary JSON Tool output.
            items:
              $ref: '#/components/schemas/Media'
            type: array
          tool_use_id:
            type: string
          type:
            const: tool_result
            type: string
        required:
        - type
        - tool_use_id
        - content
        - is_error
        type: object
    CreateSessionRequest:
      additionalProperties: false
      properties:
        agentloop:
          $ref: '#/components/schemas/AgentloopRef'
        environments:
          description: |-
            The Environments of this session, set up as part of this create. Every Tool and
            the Agentloop name one of them.
          items:
            $ref: '#/components/schemas/Environment'
          type: array
        idle_ttl_ms:
          description: |-
            How long the session may sit idle before Brain suspends it: its task and memory
            are released and rebuilt from disk on the next request. Absent means the server's
            default; zero means never.
          format: uint64
          minimum: 0
          type: integer
        model:
          $ref: '#/components/schemas/ModelSelection'
        response_format:
          description: |-
            The provider's structured-output request, applied to every model call unless the
            loop sends its own. Optional, and rejected at create for a provider that cannot
            carry it.
        system:
          default: ''
          description: |-
            The system prompt the agent loop starts from. The loop may send a different one
            on any model call.
          type: string
        tools:
          items:
            $ref: '#/components/schemas/Tool'
          type: array
        transcript:
          description: |-
            A transcript to carry forward, if the caller has one: the messages the new
            session's first model call should already see. Brain journals them as the session's
            opening transcript. Empty is an ordinary new session.
          items:
            $ref: '#/components/schemas/Message'
          type: array
      required:
      - agentloop
      - model
      - tools
      - environments
      type: object
    Dialect:
      enum:
      - openai_responses
      - anthropic_messages
      type: string
    Environment:
      description: |-
        One Environment a session declares: a name unique within the session, how Brain
        reaches it, and its own configuration, which Brain carries and never reads.
      oneOf:
      - description: Managed by brain-server in its native Environment worker pool.
        properties:
          driver:
            const: brain
            type: string
        required:
        - driver
        type: object
      - description: |-
          The process that registered as this host, reached over the connection it holds
          open: a browser tab, a Node process, a server.
        properties:
          driver:
            const: host
            type: string
          host_id:
            $ref: '#/components/schemas/HostId'
        required:
        - driver
        - host_id
        type: object
      - description: |-
          Reached over HTTP. `credential` is sent as a bearer token; the server seals it
          beside the model key and never journals it.
        properties:
          credential:
            maxLength: 16384
            minLength: 1
            type: string
          driver:
            const: http
            type: string
          url:
            format: uri
            maxLength: 2048
            minLength: 1
            type: string
        required:
        - driver
        - url
        type: object
      properties:
        configuration:
          default: null
        name:
          $ref: '#/components/schemas/EnvironmentName'
      required:
      - name
      type: object
    EnvironmentCallRequest:
      additionalProperties: false
      properties:
        input: true
      required:
      - input
      type: object
    EnvironmentCallResult:
      additionalProperties: false
      properties:
        output: true
      required:
      - output
      type: object
    EnvironmentName:
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
      type: string
    Event:
      description: |-
        One journal record as a client reads it. `(session_id, sequence)` names it; there
        is no other identifier.
      properties:
        data: true
        event_type:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          type: string
        origin:
          $ref: '#/components/schemas/EventOrigin'
          description: Absent on kernel records and historical extension records without attribution.
        recorded_at_ms:
          format: uint64
          minimum: 0
          type: integer
        sequence:
          format: uint64
          minimum: 1
          type: integer
      required:
      - sequence
      - recorded_at_ms
      - event_type
      - data
      type: object
    EventOrigin:
      oneOf:
      - additionalProperties: false
        properties:
          kind:
            const: agentloop
            type: string
          sequence:
            format: uint64
            minimum: 0
            type: integer
        required:
        - kind
        - sequence
        type: object
      - additionalProperties: false
        properties:
          kind:
            const: tool
            type: string
          sequence:
            format: uint64
            minimum: 0
            type: integer
        required:
        - kind
        - sequence
        type: object
    EventPage:
      properties:
        events:
          items:
            $ref: '#/components/schemas/Event'
          maxItems: 1000
          type: array
        next_cursor:
          format: uint64
          minimum: 0
          type: integer
      required:
      - events
      - next_cursor
      type: object
    ExecutionCall:
      additionalProperties: false
      properties:
        input: true
        method:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          type: string
      required:
      - method
      - input
      type: object
    ExecutionCallback:
      additionalProperties: false
      description: Where a remote invocation reaches only its caller-granted services.
      properties:
        methods:
          items:
            type: string
          type: array
        token:
          maxLength: 256
          minLength: 1
          type: string
        url:
          format: uri
          maxLength: 2048
          minLength: 1
          type: string
      required:
      - url
      - token
      - methods
      type: object
    FileMediaType:
      enum:
      - application/pdf
      type: string
    HostCommand:
      properties:
        deadline_at_ms:
          format: uint64
          minimum: 0
          type: integer
        environment:
          $ref: '#/components/schemas/EnvironmentName'
        operation:
          $ref: '#/components/schemas/HostOperation'
        sequence:
          format: uint64
          minimum: 1
          type: integer
        session_id:
          $ref: '#/components/schemas/SessionId'
      required:
      - environment
      - session_id
      - sequence
      - deadline_at_ms
      - operation
      type: object
    HostEvent:
      additionalProperties: false
      properties:
        data: true
        event_type:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          type: string
        sequence:
          description: The command this Event belongs to.
          format: uint64
          minimum: 1
          type: integer
        session_id:
          $ref: '#/components/schemas/SessionId'
      required:
      - session_id
      - sequence
      - event_type
      - data
      type: object
    HostEventAck:
      properties:
        sequence:
          description: The sequence Brain assigned to the committed Event.
          format: uint64
          minimum: 1
          type: integer
      required:
      - sequence
      type: object
    HostId:
      pattern: ^host_[A-Za-z0-9]{20,32}$
      type: string
    HostOperation:
      description: |-
        What a host is asked to do for a session placed in it. A call is named by the
        command's `(session_id, sequence)`; the Tool's own call id never leaves Brain.
      oneOf:
      - properties:
          input: true
          name:
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
            type: string
          type:
            const: invoke_tool
            type: string
        required:
        - type
        - name
        - input
        type: object
      - properties:
          target_sequence:
            format: uint64
            minimum: 0
            type: integer
          type:
            const: cancel_tool
            type: string
        required:
        - type
        - target_sequence
        type: object
    HostRegistration:
      properties:
        host_id:
          $ref: '#/components/schemas/HostId'
        token:
          type: string
      required:
      - host_id
      - token
      type: object
    HostResult:
      additionalProperties: false
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        sequence:
          format: uint64
          minimum: 1
          type: integer
        session_id:
          $ref: '#/components/schemas/SessionId'
      required:
      - session_id
      - sequence
      - outcome
      type: object
    KvPutRequest:
      additionalProperties: false
      properties:
        key:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          type: string
        value: true
      required:
      - key
      - value
      type: object
    Media:
      oneOf:
      - additionalProperties: false
        properties:
          type:
            const: image
            type: string
          url:
            type: string
        required:
        - type
        - url
        type: object
      - additionalProperties: false
        properties:
          media_type:
            $ref: '#/components/schemas/FileMediaType'
          type:
            const: file
            type: string
          url:
            type: string
        required:
        - type
        - media_type
        - url
        type: object
    Message:
      additionalProperties: false
      properties:
        content:
          items:
            $ref: '#/components/schemas/ContentBlock'
          type: array
        role:
          $ref: '#/components/schemas/Role'
      required:
      - role
      - content
      type: object
    MessageRequest:
      additionalProperties: false
      properties:
        input:
          $ref: '#/components/schemas/UserInput'
      required:
      - input
      type: object
    ModelCost:
      additionalProperties: false
      description: USD per million tokens.
      properties:
        cache_read:
          default: null
          format: double
          type: number
        cache_write:
          default: null
          format: double
          type: number
        input:
          format: double
          type: number
        output:
          format: double
          type: number
      required:
      - input
      - output
      type: object
    ModelDef:
      additionalProperties: false
      properties:
        attachment:
          default: null
          type: boolean
        context_window_tokens:
          default: null
          format: uint64
          minimum: 0
          type: integer
        cost:
          $ref: '#/components/schemas/ModelCost'
          default: null
        id:
          type: string
        input_modalities:
          default: null
          items:
            type: string
          type: array
        max_output_tokens:
          default: null
          format: uint64
          minimum: 0
          type: integer
        output_modalities:
          default: null
          items:
            type: string
          type: array
        reasoning:
          default: null
          type: boolean
        structured_output:
          default: null
          type: boolean
        tool_call:
          default: null
          type: boolean
      required:
      - id
      type: object
    ModelList:
      additionalProperties: false
      properties:
        providers:
          items:
            $ref: '#/components/schemas/ModelProvider'
          type: array
        snapshot_digest:
          type: string
      required:
      - snapshot_digest
      - providers
      type: object
    ModelProvider:
      additionalProperties: false
      properties:
        dialect:
          $ref: '#/components/schemas/Dialect'
        id:
          type: string
        media_inputs:
          items:
            type: string
          type: array
        models:
          items:
            $ref: '#/components/schemas/ModelDef'
          type: array
      required:
      - id
      - dialect
      - media_inputs
      - models
      type: object
    ModelRequest:
      additionalProperties: false
      properties:
        max_output_tokens:
          format: uint32
          minimum: 0
          type: integer
        messages:
          items:
            $ref: '#/components/schemas/Message'
          type: array
        options:
          additionalProperties: true
          description: Presentation options validated by the selected adapter; never execution authority.
          type: object
        response_format:
          description: Absent inherits the session default; null resets it; an object sets it.
        system:
          description: |-
            The system prompt for this call. Absent means the one the session was created
            with; empty means none. The session fills it in before the call is journalled.
          type: string
        tools:
          description: |-
            The tools to offer on this call, by name. Absent means every tool the session was
            created with; each name given must be one of them. Filled in like `system`.
          items:
            $ref: '#/components/schemas/ToolDefinition'
          type: array
      required:
      - messages
      type: object
    ModelResult:
      properties:
        message:
          $ref: '#/components/schemas/Message'
        stop_reason:
          $ref: '#/components/schemas/StopReason'
        usage:
          $ref: '#/components/schemas/Usage'
      required:
      - message
      - stop_reason
      - usage
      type: object
    ModelSelection:
      additionalProperties: false
      properties:
        api_key:
          maxLength: 16384
          minLength: 1
          type: string
        name:
          pattern: ^\S+$
          type: string
        provider:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          type: string
      required:
      - provider
      - name
      - api_key
      type: object
    Outcome:
      description: |-
        The one envelope every tool invocation resolves to.

        `timeout` is distinguished from `error` because the deadline is caller-owned: no
        backend family can be trusted to enforce one remotely, so the caller kills and says
        exactly what happened rather than encoding it as an exit code.
      oneOf:
      - properties:
          status:
            const: ok
            type: string
          value: true
        required:
        - status
        - value
        type: object
      - properties:
          error:
            $ref: '#/components/schemas/OutcomeError'
          status:
            const: error
            type: string
        required:
        - status
        - error
        type: object
      - properties:
          status:
            const: timeout
            type: string
        required:
        - status
        type: object
      - properties:
          status:
            const: cancelled
            type: string
        required:
        - status
        type: object
      - properties:
          message:
            type: string
          status:
            const: unknown
            type: string
        required:
        - status
        - message
        type: object
    OutcomeError:
      additionalProperties: false
      properties:
        code:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          type: string
        details: true
        message:
          maxLength: 4096
          type: string
        retryable:
          default: false
          type: boolean
      required:
      - code
      - message
      type: object
    Role:
      enum:
      - user
      - assistant
      - developer
      type: string
    SessionId:
      pattern: ^ses_[A-Za-z0-9]{20,32}$
      type: string
    SessionList:
      properties:
        sessions:
          items:
            $ref: '#/components/schemas/SessionSummary'
          type: array
      required:
      - sessions
      type: object
    SessionStatus:
      enum:
      - creating
      - idle
      - running
      - ending
      - ended
      - failed
      type: string
    SessionSummary:
      description: 'What the API says about a session: its id, where it is, and how far its journal goes.'
      properties:
        last_sequence:
          description: |-
            Sequence of the last journal record committed for this session — the journal is
            complete through here, so it is where a `GET /events` cursor starts.
          format: uint64
          minimum: 0
          type: integer
        session_id:
          $ref: '#/components/schemas/SessionId'
        status:
          $ref: '#/components/schemas/SessionStatus'
      required:
      - session_id
      - status
      - last_sequence
      type: object
    SessionTranscript:
      description: Canonical transcript as of a committed journal sequence, available without execution.
      properties:
        messages:
          items:
            $ref: '#/components/schemas/Message'
          type: array
        through_sequence:
          format: uint64
          minimum: 0
          type: integer
      required:
      - messages
      - through_sequence
      type: object
    StopReason:
      oneOf:
      - enum:
        - end_turn
        - tool_use
        - max_tokens
        - stop_sequence
        - refusal
        type: string
      - const: unknown
        description: |-
          The provider ended the stream without a terminal reason. Distinct from
          EndTurn on purpose: absent is never zero.
        type: string
    Tool:
      additionalProperties: false
      description: |-
        A canonical Tool definition with one implementation per authorized Environment.
        Brain validates dispatched inputs and successful outputs against this definition.
      properties:
        description:
          type: string
        input_schema:
          type: object
        name:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          type: string
        output_schema:
          type: object
        placements:
          additionalProperties: false
          description: One implementation per authorized Environment, fixed at create.
          patternProperties:
            ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$:
              $ref: '#/components/schemas/ToolPlacement'
          type: object
      required:
      - name
      - description
      - input_schema
      - placements
      type: object
    ToolAdmission:
      properties:
        error:
          $ref: '#/components/schemas/TurnError'
        id:
          $ref: '#/components/schemas/ToolId'
        status:
          $ref: '#/components/schemas/ToolAdmissionStatus'
      required:
      - id
      - status
      type: object
    ToolAdmissionStatus:
      enum:
      - admitted
      - rejected
      type: string
    ToolDefinition:
      additionalProperties: false
      description: What the model may be told about a Tool.
      properties:
        description:
          type: string
        input_schema:
          type: object
        name:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          type: string
        output_schema:
          type: object
      required:
      - name
      - description
      - input_schema
      - output_schema
      type: object
    ToolId:
      pattern: ^[0-9a-f]{64}$
      type: string
    ToolPlacement:
      additionalProperties: false
      properties:
        implementation: true
      required:
      - implementation
      type: object
    ToolResult:
      properties:
        call_id:
          type: string
        is_error:
          type: boolean
        output: true
      required:
      - call_id
      - output
      - is_error
      type: object
    TurnEmitRequest:
      additionalProperties: false
      properties:
        data: true
        event_type:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          type: string
      required:
      - event_type
      - data
      type: object
    TurnError:
      description: Why a turn, or one of the host calls inside it, failed.
      properties:
        code:
          maxLength: 128
          minLength: 1
          type: string
        message:
          maxLength: 4096
          minLength: 1
          type: string
        retryable:
          default: false
          type: boolean
      required:
      - code
      - message
      type: object
    Usage:
      description: |-
        Provider-reported usage. Every field is `Option` because **absent is never
        zero** -- a provider that does not report cache reads is not a provider that
        read zero cache tokens.
      properties:
        cache_creation_input_tokens:
          format: uint64
          minimum: 0
          type: integer
        cache_read_input_tokens:
          format: uint64
          minimum: 0
          type: integer
        input_tokens:
          format: uint64
          minimum: 0
          type: integer
        output_tokens:
          format: uint64
          minimum: 0
          type: integer
        provider_cost_usd:
          type: string
        reasoning_tokens:
          format: uint64
          minimum: 0
          type: integer
      type: object
    UserInput:
      additionalProperties: false
      description: What an application hands a session on `send`.
      properties:
        media:
          items:
            $ref: '#/components/schemas/Media'
          type: array
        message:
          minLength: 1
          type: string
      required:
      - message
      type: object
info:
  description: Versioned Brain HTTP transport
  license:
    identifier: MIT
    name: MIT
  title: Brain HTTP API
  version: 1.0.0
openapi: 3.1.0
paths:
  /health/live:
    get:
      operationId: live
      responses:
        '204':
          description: Process is live
  /health/ready:
    get:
      operationId: ready
      responses:
        '204':
          description: Process is ready
        '503':
          description: Required dependency is unavailable
  /v1/agentloops:
    post:
      operationId: admitAgentloop
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 256
          minLength: 1
          type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentloopAdmission'
          description: Agentloop admitted
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Structured error
  /v1/agentloops/{id}:
    get:
      operationId: getAgentloop
      parameters:
      - in: path
        name: id
        required: true
        schema:
          $ref: '#/components/schemas/AgentloopId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentloopAdmission'
          description: Admission status
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Structured error
  /v1/hosts:
    post:
      operationId: registerHost
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostRegistration'
          description: Registered host
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Structured error
  /v1/hosts/{host_id}/commands:
    get:
      operationId: hostCommands
      parameters:
      - in: path
        name: host_id
        required: true
        schema:
