[package]
name = "brain-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The standalone Brain server"
publish = false

[dependencies]
brain = { workspace = true }
brain-component-host = { path = "../brain-component-host" }
brain-loophost = { workspace = true, optional = true }
brain-providers = { workspace = true }
brain-standalone = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
brain-protocol = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
default = ["loophost"]
loophost = ["dep:brain-loophost"]

[dev-dependencies]
regex = { workspace = true }
tower = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
walkdir = { workspace = true }
