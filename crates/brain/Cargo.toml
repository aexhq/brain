[package]
name = "brain"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The aex brain core: sessions, the journal semantics, the sealed prefix, the provider dialects, the tool loop and the session API -- substrate-generic, composed via adapters."

[dependencies]
aex-contracts = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
globset = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
