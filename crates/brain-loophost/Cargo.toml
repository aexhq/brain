[package]
name = "brain-loophost"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The loop host: runs agentloop guest components (JS compiled into a wasm sandbox) and drives Brain turns through the agentloop seam."
publish = false

[dependencies]
brain = { path = "../brain" }

anyhow = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros"] }
tracing = { workspace = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }

[dev-dependencies]
brain-protocol = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time"] }
