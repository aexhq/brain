[package]
name = "brain-loophost"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bounded Wasmtime Component host for Brain Agentloops"
publish = false
autobins = false

[features]
integration-tests = []

[[bin]]
name = "brain-loop-worker"
path = "src/worker/main.rs"

[[test]]
name = "worker_process"
path = "tests/worker_process.rs"
required-features = ["integration-tests"]

[[test]]
name = "in_process"
path = "tests/in_process.rs"
required-features = ["integration-tests"]

[dependencies]
brain-protocol = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "process", "net", "io-util", "sync", "macros", "rt-multi-thread"] }
wasmtime = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Builds the smallest possible runaway guest for the epoch-deadline test. Already in the
# lock file as a Wasmtime component dependency, so it costs no new crate.
wasm-encoder = "0.254"
