[package]
name = "brain-loophost"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The loop host: runs agentloop guest components (JS compiled into a wasm sandbox) and drives Brain turns through the agentloop seam."
publish = false

[dependencies]
brain = { path = "../brain" }
brain-protocol = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "net", "io-util", "rt-multi-thread", "process"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time"] }
