name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: brain-test
          POSTGRES_DB: brain
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BRAIN_TEST_POSTGRES: postgres://postgres:brain-test@localhost:5432/brain?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go test -tags postgres ./internal/persistence
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm --prefix runners/pi ci --ignore-scripts
      - run: npm --prefix sdks/typescript ci --ignore-scripts
      - run: npm --prefix website ci --ignore-scripts
      - run: npm --prefix services/sandbox ci --ignore-scripts
      - run: node scripts/check.mjs
      - run: go build -o bin/brain ./cmd/brain
      - if: runner.os == 'Linux'
        run: docker build --tag brain:local-dev .
      - if: runner.os == 'Linux'
        run: node scripts/container-smoke.mjs
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm --prefix runners/pi ci --ignore-scripts
      - run: npm --prefix runners/pi run build
      - run: go test -race ./...

