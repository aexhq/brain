name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm ci
      # Renders each crate's generated/contract/ from its Rust types, then the SDK from
      # those. A diff means a type changed without its contract being regenerated, or a
      # generated file was edited by hand.
      - run: npm run gen
      - run: git diff --exit-code -- crates/brain-protocol/generated crates/brain-http/generated crates/brain/generated catalog crates/brain/src/model/generated packages/brain-sdk/src/generated packages/brain-sdk/contracts docs/reference/configuration.mdx
      - run: npm test
      - run: npm run package-smoke

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
      # Reads package-lock.json; no install, so a slow registry costs this job alone.
      - run: npm audit --audit-level=high

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: git diff --check

  rust-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-debug
      - run: cargo test --workspace --all-targets

  rust-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  brain-env:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-debug
      - name: Build the diagnostic Agentloop Component
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path tests/fixtures/diagnostic-agentloop/Cargo.toml --target wasm32-wasip2 --release
          cargo build --manifest-path tests/fixtures/diagnostic-tool/Cargo.toml --target wasm32-wasip2 --release
          cargo build --manifest-path examples/reference-agentloop/Cargo.toml --target wasm32-wasip2 --release
          cp tests/fixtures/diagnostic-agentloop/target/wasm32-wasip2/release/diagnostic_agentloop.wasm "$RUNNER_TEMP/diagnostic-agentloop.wasm"
          cp tests/fixtures/diagnostic-tool/target/wasm32-wasip2/release/diagnostic_tool.wasm "$RUNNER_TEMP/diagnostic-tool.wasm"
          cp examples/reference-agentloop/target/wasm32-wasip2/release/reference_agentloop.wasm "$RUNNER_TEMP/reference-agentloop.wasm"
      - run: bash tools/build-python-fixtures.sh "$RUNNER_TEMP/python"
      - name: Admit and activate through the real Linux worker process
        env:
          BRAIN_TEST_PYTHON_AGENTLOOP: ${{ runner.temp }}/python/python-agentloop.wasm
          BRAIN_TEST_PYTHON_TOOL: ${{ runner.temp }}/python/python-tool.wasm
          BRAIN_TEST_AGENTLOOP_PACKAGE: ${{ runner.temp }}/diagnostic-agentloop.wasm
          BRAIN_TEST_TOOL_COMPONENT: ${{ runner.temp }}/diagnostic-tool.wasm
          BRAIN_TEST_REFERENCE_AGENTLOOP: ${{ runner.temp }}/reference-agentloop.wasm
        run: cargo test -p brain-env --features integration-tests --test worker_process --test in_process

      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm ci && npm run build
      - run: cargo build -p brain-server --bin brain -p brain-env --bin brain-env-worker
      - name: Exercise lazy providers, cold history, and retained sessions through HTTP
        env:
          BRAIN_TEST_SERVER: ${{ github.workspace }}/target/debug/brain
          BRAIN_TEST_WORKER: ${{ github.workspace }}/target/debug/brain-env-worker
          BRAIN_TEST_REFERENCE_AGENTLOOP: ${{ runner.temp }}/reference-agentloop.wasm
        run: node tests/release/runtime.mjs
      - name: Run SDK user journeys in parallel
        env:
          BRAIN_TEST_SERVER: ${{ github.workspace }}/target/debug/brain
          BRAIN_TEST_WORKER: ${{ github.workspace }}/target/debug/brain-env-worker
          BRAIN_TEST_PYTHON_AGENTLOOP: ${{ runner.temp }}/python/python-agentloop.wasm
          BRAIN_TEST_PYTHON_TOOL: ${{ runner.temp }}/python/python-tool.wasm
          BRAIN_TEST_AGENTLOOP_PACKAGE: ${{ runner.temp }}/diagnostic-agentloop.wasm
          BRAIN_TEST_TOOL_COMPONENT: ${{ runner.temp }}/diagnostic-tool.wasm
          BRAIN_TEST_REFERENCE_AGENTLOOP: ${{ runner.temp }}/reference-agentloop.wasm
        run: npm run test:journeys
      - name: Verify every package release fixture before publication
        env:
          BRAIN_TEST_SERVER: ${{ github.workspace }}/target/debug/brain
          BRAIN_TEST_WORKER: ${{ github.workspace }}/target/debug/brain-env-worker
          BRAIN_TEST_AGENTLOOP_PACKAGE: ${{ runner.temp }}/diagnostic-agentloop.wasm
        run: bash tools/check-release-fixtures.sh

  image-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t brain:test .
      - name: Start the release image and exercise health and auth
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name brain-test -p 18080:8080 \
            -e BRAIN_API_TOKEN=test-token \
            brain:test
          trap 'docker logs brain-test; docker rm -f brain-test >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready >/dev/null; then break; fi
            test "$attempt" -lt 60
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/v1/sessions)" = 401
          curl --fail --silent -H 'authorization: Bearer test-token' http://127.0.0.1:18080/v1/sessions | jq -e '.sessions == []'

  build-test:
    if: always()
    needs: [contracts, audit, lint, rust-core, rust-platforms, brain-env, image-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Every release gate passed
        env:
          CONTRACTS: ${{ needs.contracts.result }}
          AUDIT: ${{ needs.audit.result }}
          LINT: ${{ needs.lint.result }}
          CORE: ${{ needs.rust-core.result }}
          PLATFORMS: ${{ needs.rust-platforms.result }}
          ENV: ${{ needs.brain-env.result }}
          IMAGE: ${{ needs.image-smoke.result }}
        run: |
          test "$CONTRACTS" = success
          test "$AUDIT" = success
          test "$LINT" = success
          test "$CORE" = success
          test "$PLATFORMS" = success
          test "$ENV" = success
          test "$IMAGE" = success
