name: ci
on:
  push:
    branches: [main]
  pull_request:

# Every job here only reads the repository; none needs a writable GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  sdk:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm ci
      # Generated contract artifacts must match their source schemas — a contract change
      # without a regen ships stale published types (found by the 2026-08-22 audit).
      - name: generated artifacts are fresh
        if: runner.os == 'Linux'
        run: |
          npm run gen -w packages/brain
          git diff --exit-code packages/brain
      - run: npm test
      - run: npm run package-smoke

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude brain-loophost

  test-loophost:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            crates/brain-loophost/guest/package-lock.json
      # The guest components (and the seeded-official loop store inside dist) are a pure
      # function of these inputs; a hit skips the npm installs, every componentization, and
      # the official-loop seeding admissions, which otherwise dominate this job.
      - name: cache loop guest components
        uses: actions/cache@v4
        with:
          path: crates/brain-loophost/guest/dist
          key: loop-guests-${{ runner.os }}-${{ hashFiles('crates/brain-loophost/guest/*.mjs', 'crates/brain-loophost/guest/package.json', 'crates/brain-loophost/guest/package-lock.json', 'crates/brain-loophost/wit/guest.wit', 'packages/agentloop/src/**', 'packages/agentloop/package.json', 'packages/loop-pi/src/**', 'packages/loop-pi/build.mjs', 'packages/loop-pi/package.json', 'packages/loop-codex/src/**', 'packages/loop-codex/build.mjs', 'packages/loop-codex/package.json', 'package-lock.json') }}
      # The engine's own compilation cache (self-validating, keyed by engine config + content):
      # a hit turns each multi-minute cranelift compile of a component into a fast deserialize.
      # restore-keys is safe — wasmtime revalidates every entry itself.
      - name: cache wasmtime compiled components
        uses: actions/cache@v4
        with:
          path: ~/.cache/wasmtime
          key: wasmtime-components-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('crates/brain-loophost/guest/*.mjs', 'packages/agentloop/src/**', 'packages/loop-pi/src/**', 'packages/loop-codex/src/**', 'package-lock.json') }}
          restore-keys: |
            wasmtime-components-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      # The loop packages build through the public toolchain here (not inside the test
      # binary), so the e2e's ensure_component only fills gaps.
      - run: npm ci
      - run: npm run build -w packages/agentloop -w packages/loop-pi -w packages/loop-codex
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p brain-loophost

  # The branch-protection gate. Splitting the old serial job into the parallel legs above must
  # not silently weaken protection: this job keeps the required check name and fails unless
  # every leg succeeded (`if: always()` because a skipped required check would satisfy GitHub).
  build-test:
    if: always()
    needs: [lint, test, test-loophost]
    runs-on: ubuntu-24.04
    steps:
      - name: every gate passed
        run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.test-loophost.result }}" = "success"

  benchmark-leakage:
    # This release gate is deliberately independent from fmt/clippy/tests: release-mode density
    # and leakage compilation has little reusable output in common with the debug quality gate,
    # and serializing it there needlessly extends the whole PR critical path.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      # Benchmark gates. Thresholds are backstops for a shared 2-vCPU runner (catch
      # order-of-magnitude regressions like the Nagle 40ms/write stall); the published
      # numbers come from the ARM target run recorded in BENCHMARKS.md.
      - name: benchmark gates (density, reclaim, creep, turns/s, TTFT) + leakage
        run: |
          cargo run -p brain-bench --release -- ci \
            --gate-max-turn-p99-ms 250 \
            --gate-max-ttft-p99-ms 100 \
            --gate-min-turns-per-sec 40 \
            --gate-max-kib-per-session 256 \
            --gate-min-reclaim-pct 50 \
            --gate-max-creep-mib 8
