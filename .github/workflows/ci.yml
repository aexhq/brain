name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: '32 6 * * 1'
permissions:
  contents: read
jobs:
  security:
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          category: /language:${{ matrix.language }}

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: brain-test
          POSTGRES_DB: brain
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BRAIN_TEST_POSTGRES: postgres://postgres:brain-test@localhost:5432/brain?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go test -tags postgres ./internal/persistence
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm --prefix runners/pi ci --ignore-scripts
      - run: npm --prefix runners/codex ci --ignore-scripts
      - run: npm --prefix runners/opencode ci --ignore-scripts
      - run: npm --prefix sdks/typescript ci --ignore-scripts
      - run: npm --prefix website ci --ignore-scripts
      - run: npm --prefix services/sandbox ci --ignore-scripts
      - run: npm --prefix services/browser ci --ignore-scripts
      - run: npm --prefix services/browser run install-browser
      - if: runner.os == 'Linux'
        run: npm --prefix services/browser exec -- playwright install-deps chromium
      - run: node scripts/check.mjs
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sdk-packages
          path: dist/sdk/
          if-no-files-found: error
          retention-days: 30
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: server-packages
          path: dist/server/
          if-no-files-found: error
          retention-days: 30
      - run: go build -o bin/ ./cmd/brain ./cmd/resource-tools ./cmd/mcp-tools
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: binaries-${{ runner.os }}
          path: |
            bin/brain
            bin/brain.exe
            bin/resource-tools
            bin/resource-tools.exe
            bin/mcp-tools
            bin/mcp-tools.exe
          retention-days: 7
      - if: runner.os == 'Linux'
        run: docker build --tag brain:local-dev .
      - if: runner.os == 'Linux'
        run: node scripts/container-smoke.mjs
      - if: runner.os == 'Linux'
        run: docker build --file services/sandbox/Dockerfile --tag brain-sandbox-tools:local-dev .
      - if: runner.os == 'Linux'
        run: node scripts/sandbox-container-smoke.mjs
      - if: runner.os == 'Linux'
        run: docker build --file services/browser/Dockerfile --tag brain-browser-tools:local-dev .
      - if: runner.os == 'Linux'
        run: docker save brain:local-dev brain-sandbox-tools:local-dev brain-browser-tools:local-dev -o images.tar
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tested-images
          path: images.tar
          retention-days: 7
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm --prefix runners/pi ci --ignore-scripts
      - run: npm --prefix runners/codex ci --ignore-scripts
      - run: npm --prefix runners/opencode ci --ignore-scripts
      - run: npm --prefix runners/pi run build
      - run: go test -race ./...

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_BASE_PATH: /brain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm --prefix runners/pi ci --ignore-scripts
      - run: npm --prefix website ci --ignore-scripts
      - run: npm --prefix website run build
      - run: npm --prefix website test
      - uses: actions/upload-pages-artifact@5f327015a708106f6f1b7c9a633901af30fe80cb
        with:
          path: website/out

  # Preserve the existing protected-branch gate while replacing its old Rust suite.
  build-test:
    if: always()
    needs: [checks, race, postgres, docs, security]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json,os; results=json.loads(os.environ["RESULTS"]); assert all(job["result"] == "success" for job in results.values()), results'

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tested-images
      - run: docker load -i images.tar
      - name: Publish the tested images
        id: images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for image in brain brain-sandbox-tools brain-browser-tools; do
            ref="ghcr.io/aexhq/$image"
            docker tag "$image:local-dev" "$ref:sha-$GITHUB_SHA"
            docker tag "$image:local-dev" "$ref:main"
            docker push "$ref:sha-$GITHUB_SHA"
            docker push "$ref:main"
            digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$ref:sha-$GITHUB_SHA" | cut -d@ -f2)
            echo "$image=$digest" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/aexhq/brain
          subject-digest: ${{ steps.images.outputs.brain }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/aexhq/brain-sandbox-tools
          subject-digest: ${{ steps.images.outputs.brain-sandbox-tools }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/aexhq/brain-browser-tools
          subject-digest: ${{ steps.images.outputs.brain-browser-tools }}
          push-to-registry: true

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Deploy tested static site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: Verify public documentation and reference assets
        env:
          DOCS_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/docs-smoke.mjs "$DOCS_URL"


  release-sdks:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish, deploy-docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Dispatch SDK publication at the verified commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="release/sha-$GITHUB_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git fetch --depth=1 origin "refs/tags/$tag"
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          gh workflow run npm-publish.yml --ref "$tag" -f ci_run="$GITHUB_RUN_ID"
