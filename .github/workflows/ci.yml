name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm ci
      - run: npm run gen
      - run: git diff --exit-code -- contracts crates/brain-protocol/src/generated.rs packages/brain-sdk/src/generated packages/brain-sdk/contracts
      - run: npm test
      - run: npm run package-smoke
      - run: npm audit --audit-level=high

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: git diff --check

  rust-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-debug
      - run: cargo test -p brain-protocol -p brain-telemetry -p brain -p brain-http

  rust-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  loophost:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: aexhq/extensions
          path: extensions
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm ci
      - name: Build the public TypeScript diagnostic Agentloop against this Brain
        shell: bash
        run: |
          set -euo pipefail
          brain_archive=$(npm pack --silent --workspace @aexhq/brain --pack-destination "$RUNNER_TEMP")
          cp -R extensions/packages/agentloop "$RUNNER_TEMP/agentloop"
          cd "$RUNNER_TEMP/agentloop"
          npm pkg set "dependencies.@aexhq/brain=file:$RUNNER_TEMP/$brain_archive"
          npm install --ignore-scripts
          npm test
          node dist/cli.js build test/fixtures/diagnostic-loop.mjs --out "$RUNNER_TEMP/diagnostic.brain.json"
          npm audit --audit-level=high
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-debug
      - name: Admit and activate through the real Linux worker process
        env:
          BRAIN_TEST_AGENTLOOP_PACKAGE: ${{ runner.temp }}/diagnostic.brain.json
        run: cargo test -p brain-loophost --features integration-tests --test worker_process

  image-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t brain:test .
      - name: Start the release image and exercise health and auth
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name brain-test -p 18080:8080 \
            -e BRAIN_API_TOKEN=test-token \
            brain:test
          trap 'docker logs brain-test; docker rm -f brain-test >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready >/dev/null; then break; fi
            test "$attempt" -lt 60
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/v1/sessions)" = 401
          curl --fail --silent -H 'authorization: Bearer test-token' http://127.0.0.1:18080/v1/sessions | jq -e '.sessions == []'

  benchmark-leakage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Exercise bounded resources in release mode
        run: cargo test --release -p brain-telemetry -p brain-loophost -p brain-server --all-targets
      - name: Bound Brain HTTP memory after sustained requests
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p brain-server --bin brain \
            -p brain-loophost --bin brain-loop-worker
          data_dir=$(mktemp -d)
          BRAIN_LISTEN=127.0.0.1:18081 \
          BRAIN_DATA_DIR="$data_dir" \
          BRAIN_API_TOKEN=test-token \
          BRAIN_LOOP_WORKER=target/release/brain-loop-worker \
            target/release/brain >"$RUNNER_TEMP/brain-benchmark.log" 2>&1 &
          brain_pid=$!
          trap 'kill "$brain_pid" 2>/dev/null || true; wait "$brain_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/brain-benchmark.log"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18081/health/ready >/dev/null; then break; fi
            test "$attempt" -lt 60
            sleep 1
          done
          rss_before=$(ps -o rss= -p "$brain_pid")
          for _ in $(seq 1 10000); do
            curl --fail --silent -H 'authorization: Bearer test-token' \
              http://127.0.0.1:18081/v1/sessions >/dev/null
          done
          rss_after=$(ps -o rss= -p "$brain_pid")
          rss_growth=$((rss_after - rss_before))
          test "$rss_after" -le 262144
          test "$rss_growth" -le 16384
          printf 'Brain RSS: before=%s KiB after=%s KiB growth=%s KiB\n' \
            "$rss_before" "$rss_after" "$rss_growth"

  build-test:
    if: always()
    needs: [contracts, lint, rust-core, rust-platforms, loophost, image-smoke, benchmark-leakage]
    runs-on: ubuntu-24.04
    steps:
      - name: Every release gate passed
        env:
          CONTRACTS: ${{ needs.contracts.result }}
          LINT: ${{ needs.lint.result }}
          CORE: ${{ needs.rust-core.result }}
          PLATFORMS: ${{ needs.rust-platforms.result }}
          LOOPHOST: ${{ needs.loophost.result }}
          IMAGE: ${{ needs.image-smoke.result }}
          BENCHMARK: ${{ needs.benchmark-leakage.result }}
        run: |
          test "$CONTRACTS" = success
          test "$LINT" = success
          test "$CORE" = success
          test "$PLATFORMS" = success
          test "$LOOPHOST" = success
          test "$IMAGE" = success
          test "$BENCHMARK" = success
