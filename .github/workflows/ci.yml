name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      contracts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.common == 'true' || steps.filter.outputs.rust == 'true' || steps.filter.outputs.npm == 'true' || steps.filter.outputs.generated-doc == 'true' }}
      audit: ${{ github.event_name != 'pull_request' || steps.filter.outputs.common == 'true' || steps.filter.outputs.dependencies == 'true' }}
      lint: ${{ github.event_name != 'pull_request' || steps.filter.outputs.common == 'true' || steps.filter.outputs.rust == 'true' }}
      rust-core: ${{ github.event_name != 'pull_request' || steps.filter.outputs.common == 'true' || steps.filter.outputs.rust == 'true' }}
      rust-platforms: ${{ github.event_name != 'pull_request' || steps.filter.outputs.common == 'true' || steps.filter.outputs.rust == 'true' }}
      brain-env: ${{ github.event_name != 'pull_request' || steps.filter.outputs.common == 'true' || steps.filter.outputs.rust == 'true' || steps.filter.outputs.npm == 'true' || steps.filter.outputs.runtime-tests == 'true' }}
      image-smoke: ${{ github.event_name != 'pull_request' || steps.filter.outputs.common == 'true' || steps.filter.outputs.rust == 'true' || steps.filter.outputs.image == 'true' }}
      session-server: ${{ github.event_name != 'pull_request' || steps.filter.outputs.common == 'true' || steps.filter.outputs.rust == 'true' || steps.filter.outputs.npm == 'true' || steps.filter.outputs.runtime-tests == 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      # Compare the tested merge commit with its base, including every PR commit and both rename paths.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          token: ''
          predicate-quantifier: every
          filters: |
            common:
              - '!*.md'
              - '!**/README*.md'
              - '!docs/**/*.{md,mdx}'
              - '!docs/**/meta.json'
              - '!references/**/*.md'
              - '!references/architecture.{png,excalidraw}'
              - '!{crates,catalog,packages/brain-sdk,examples,tests}/**'
              - '!{Cargo.toml,Cargo.lock,rust-toolchain.toml,rustfmt.toml,package.json,package-lock.json,Dockerfile,.dockerignore}'
            rust:
              - '{crates/**,catalog/**,Cargo.toml,Cargo.lock,rust-toolchain.toml,rustfmt.toml}'
              - '!**/README*.md'
            npm:
              - '{packages/brain-sdk/**,examples/**,package.json,package-lock.json}'
              - '!**/README*.md'
            dependencies:
              - '**/package{,-lock}.json'
            runtime-tests:
              - 'tests/**'
              - '!**/README*.md'
            image:
              - '{Dockerfile,.dockerignore}'
            generated-doc:
              - 'docs/reference/configuration.mdx'

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm ci
      # Renders each crate's generated/contract/ from its Rust types, then the SDK from
      # those. A diff means a type changed without its contract being regenerated, or a
      # generated file was edited by hand.
      - run: npm run gen
      - run: git diff --exit-code -- crates/brain-protocol/generated crates/brain-http/generated crates/brain/generated catalog crates/brain/src/model/generated packages/brain-sdk/src/generated packages/brain-sdk/contracts internal/generated packages/brain-python/brain/generated docs/reference/configuration.mdx
      - run: mkdir -p .build/scratch && npm test
        env:
          TMPDIR: ${{ github.workspace }}/.build/scratch
          TMP: ${{ github.workspace }}/.build/scratch
          TEMP: ${{ github.workspace }}/.build/scratch
      - run: npm run package-smoke

  audit:
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
      # Reads package-lock.json; no install, so a slow registry costs this job alone.
      - run: npm audit --audit-level=high

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: git diff --check

  rust-core:
    needs: changes
    if: needs.changes.outputs.rust-core == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-debug
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: cargo test --workspace --all-targets

  rust-platforms:
    needs: changes
    if: needs.changes.outputs.rust-platforms == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: cargo test --workspace --all-targets
      - name: Build the diagnostic Components
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path tests/fixtures/diagnostic-tool/Cargo.toml --target wasm32-wasip2 --release
      - name: Admit and activate through the real worker process
        shell: bash
        env:
          BRAIN_TEST_TOOL_COMPONENT: ${{ github.workspace }}/tests/fixtures/diagnostic-tool/target/wasm32-wasip2/release/diagnostic_tool.wasm
        run: cargo test -p brain-env-worker --features integration-tests --test worker_process --test preparation

  brain-env:
    needs: changes
    if: needs.changes.outputs.brain-env == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-debug
      - name: Build the diagnostic Tool Component
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path tests/fixtures/diagnostic-tool/Cargo.toml --target wasm32-wasip2 --release
          cp tests/fixtures/diagnostic-tool/target/wasm32-wasip2/release/diagnostic_tool.wasm "$RUNNER_TEMP/diagnostic-tool.wasm"
      - run: bash tools/build-python-fixtures.sh "$RUNNER_TEMP/python"
      - name: Admit and activate through the real Linux worker process
        env:
          BRAIN_TEST_PYTHON_TOOL: ${{ runner.temp }}/python/python-tool.wasm
          BRAIN_TEST_TOOL_COMPONENT: ${{ runner.temp }}/diagnostic-tool.wasm
        run: cargo test -p brain-env-worker --features integration-tests --test worker_process --test preparation --test in_process

      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm ci && npm run build
      - name: Verify Python Environment preparation with a real isolated project
        run: |
          "$RUNNER_TEMP/python/venv/bin/pip" install --disable-pip-version-check uv==0.8.15
          BRAIN_TEST_UV="$RUNNER_TEMP/python/venv/bin/uv" node --test examples/python-environment.test.mjs
      - run: cargo build -p brain-server --bin brain --bin brain-check-media-upgrade -p brain-env-worker --bin brain-env-worker
      - name: Exercise lazy providers, cold history, and retained sessions through HTTP
        env:
          BRAIN_TEST_SERVER: ${{ github.workspace }}/target/debug/brain
          BRAIN_TEST_WORKER: ${{ github.workspace }}/target/debug/brain-env-worker
        run: node tests/release/runtime.mjs
      - name: Run SDK user journeys in parallel
        env:
          BRAIN_TEST_SERVER: ${{ github.workspace }}/target/debug/brain
          BRAIN_TEST_WORKER: ${{ github.workspace }}/target/debug/brain-env-worker
          BRAIN_TEST_PYTHON_TOOL: ${{ runner.temp }}/python/python-tool.wasm
          BRAIN_TEST_TOOL_COMPONENT: ${{ runner.temp }}/diagnostic-tool.wasm
        run: npm run test:journeys
      - name: Verify every package release fixture before publication
        env:
          BRAIN_TEST_SERVER: ${{ github.workspace }}/target/debug/brain
          BRAIN_TEST_WORKER: ${{ github.workspace }}/target/debug/brain-env-worker
        run: bash tools/check-release-fixtures.sh

  image-smoke:
    needs: changes
    if: needs.changes.outputs.image-smoke == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t brain:test .
      - name: Start the release image and exercise health and auth
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name brain-test -p 18080:8080 \
            -e BRAIN_API_TOKEN=test-token \
            -v "$PWD/tests:/opt/brain/tests:ro" \
            -e 'BRAIN_AGENTLOOPS={"fixture":{"command":"node","args":["/opt/brain/tests/fixtures/harness.mjs"]}}' \
            brain:test
          trap 'docker logs brain-test; docker rm -f brain-test >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready >/dev/null; then break; fi
            test "$attempt" -lt 60
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/v1/sessions)" = 401
          curl --fail --silent -H 'authorization: Bearer test-token' http://127.0.0.1:18080/v1/sessions | jq -e '.sessions == []'

  session-server:
    needs: changes
    if: needs.changes.outputs.session-server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOMAXPROCS: "4"
      GOTMPDIR: ${{ github.workspace }}/.build/go
      TMPDIR: ${{ github.workspace }}/.build/scratch
      TMP: ${{ github.workspace }}/.build/scratch
      TEMP: ${{ github.workspace }}/.build/scratch
    steps:
      - uses: actions/checkout@v7
      - run: mkdir -p .build/go .build/scratch
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "24.17.0"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
      - run: npm ci && npm run build -w packages/brain-sdk && npm test -w packages/brain-d1
      - name: Check Go components and static diagnostics
        run: |
          test -z "$(gofmt -l $(find internal adapters cmd -name '*.go'))"
          go vet ./internal/... ./adapters/... ./cmd/...
          go test ./internal/... ./adapters/... ./cmd/...
          go build -o .build/brain ./cmd/brain
          go build -o .build/brain-worker ./cmd/brain-worker
          CGO_ENABLED=0 go build -o .build/brain-linux ./cmd/brain
      - name: Pull immutable managed-code fixture images
        run: |
          docker pull node@sha256:862263c612aa437e3037674b85419622a9d93bff80aa1eee5398dfe686375532
          docker pull python@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
      - name: Run public SDK and real supplied-code journeys
        run: node --test --test-concurrency=1 tests/greenfield/journeys.test.mjs tests/greenfield/managed.journeys.test.mjs
      - name: Run actual D1 public journeys
        env:
          BRAIN_TEST_CONTROL: d1
        run: node --test --test-concurrency=1 tests/greenfield/journeys.test.mjs
      - name: Run PostgreSQL and real Linux multi-process faults
        shell: pwsh
        run: ./tests/greenfield/postgres-emulator.ps1 -Cluster
      - name: Verify native S3 and DynamoDB transcript bodies
        shell: pwsh
        run: ./tests/greenfield/archive-emulators.ps1

  build-test:
    if: always()
    needs: [changes, contracts, audit, lint, rust-core, rust-platforms, brain-env, image-smoke, session-server]
    runs-on: ubuntu-24.04
    steps:
      - name: Every affected check passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { changes, ...jobs } = JSON.parse(process.env.NEEDS);
          assert.equal(changes.result, 'success', 'change detection must succeed');
          for (const [name, job] of Object.entries(jobs)) {
            const selected = changes.outputs[name];
            assert.ok(['true', 'false'].includes(selected), `${name}: missing selection`);
            const expected = selected === 'true' ? 'success' : 'skipped';
            assert.equal(job.result, expected, `${name}: expected ${expected}, got ${job.result}`);
          }
          NODE
