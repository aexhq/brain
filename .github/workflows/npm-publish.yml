name: release Brain

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish immutable versions under next, or promote those same versions to latest
        type: choice
        required: true
        default: stage
        options:
          - stage
          - promote
      expected_commit:
        description: Exact 40-character Brain commit selected by the workflow ref
        type: string
        required: true
      release_scope:
        description: Package set to stage; promotion consumes the selected stage artifact
        type: choice
        required: true
        default: all
        options:
          - all
      stage_run_id:
        description: Successful stage workflow run containing the immutable archives (promote only)
        type: string
        required: false
        default: ''
      image_run_id:
        description: Successful candidate-image workflow run for this commit (stage only)
        type: string
        required: false
        default: ''

concurrency:
  group: brain-npm-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the immutable source identity
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          OPERATION: ${{ inputs.operation }}
          SELECTED_COMMIT: ${{ github.sha }}
          SELECTED_REF: ${{ github.ref }}
          STAGE_RUN_ID: ${{ inputs.stage_run_id }}
          IMAGE_RUN_ID: ${{ inputs.image_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$SELECTED_COMMIT" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$SELECTED_REF" = "refs/tags/release/sha-$EXPECTED_COMMIT"
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          git merge-base --is-ancestor "$EXPECTED_COMMIT" origin/main
          if [[ "$OPERATION" == promote ]]; then
            [[ "$STAGE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            test -z "$IMAGE_RUN_ID"
            stage_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGE_RUN_ID")
            test "$(jq -r .head_sha <<<"$stage_run")" = "$EXPECTED_COMMIT"
            test "$(jq -r .event <<<"$stage_run")" = workflow_dispatch
            test "$(jq -r .status <<<"$stage_run")" = completed
            test "$(jq -r .conclusion <<<"$stage_run")" = success
            stage_path=$(jq -r .path <<<"$stage_run")
            [[ "$stage_path" == .github/workflows/npm-publish.yml || \
              "$stage_path" == .github/workflows/npm-publish.yml@* ]]
          else
            test -z "$STAGE_RUN_ID"
            [[ "$IMAGE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            image_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IMAGE_RUN_ID")
            test "$(jq -r .head_sha <<<$image_run)" = "$EXPECTED_COMMIT"
            test "$(jq -r .event <<<$image_run)" = workflow_run
            test "$(jq -r .status <<<$image_run)" = completed
            test "$(jq -r .conclusion <<<$image_run)" = success
            image_path=$(jq -r .path <<<$image_run)
            [[ "$image_path" == .github/workflows/image.yml || \
              "$image_path" == .github/workflows/image.yml@* ]]
          fi

  prepare:
    if: inputs.operation == 'stage'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      versions: ${{ steps.pack.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use the npm version pinned for trusted publishing
        run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm test
      - run: npm run package-smoke
      - name: Pack the exact release archives
        id: pack
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/brain-npm-release"
          case "$RELEASE_SCOPE" in
            all) unset RELEASE_WORKSPACES ;;
            *) echo "unsupported release scope: $RELEASE_SCOPE" >&2; exit 1 ;;
          esac
          node tools/npm-release.mjs pack "$release_dir"
          versions=$(node tools/npm-release.mjs versions "$release_dir/manifest.json")
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          {
            echo '### Immutable Brain npm archives'
            echo
            node tools/npm-release.mjs markdown "$release_dir/manifest.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v7
        with:
          name: brain-image-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/brain-npm-release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.image_run_id }}
      - name: Bind the candidate image to this release
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          jq -e --arg source "$EXPECTED_COMMIT" '
            .schema == 1 and .source_sha == $source and
            (.image | test("^ghcr\\.io/aexhq/brain$")) and
            (.manifest_digest | test("^sha256:[0-9a-f]{64}$"))
          ' "$RUNNER_TEMP/brain-npm-release/brain-image.json" >/dev/null
      - uses: actions/upload-artifact@v6
        with:
          name: brain-npm-release-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/brain-npm-release
          if-no-files-found: error
          retention-days: 30

  stage:
    if: inputs.operation == 'stage'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: brain-npm-release-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/brain-npm-release
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use the npm version pinned for trusted publishing
        run: npm install --global npm@11.19.0
      - name: Publish once with provenance under next
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: node "$RUNNER_TEMP/brain-npm-release/publish.mjs" stage
      - name: Record staged versions
        shell: bash
        env:
          VERSIONS: ${{ needs.prepare.outputs.versions }}
        run: |
          echo "Staged exact versions under npm dist-tag \`next\`: \`$VERSIONS\`" >> "$GITHUB_STEP_SUMMARY"

  e2e-sdk:
    if: inputs.operation == 'stage'
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: brain-npm-release-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/brain-release
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install the staged public SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk=$(jq -er '.packages[] | select(.name == "@aexhq/brain") | "\(.name)@\(.version)"' "$RUNNER_TEMP/brain-release/manifest.json")
          test "$(npm view "$sdk" version)" = "${sdk##*@}"
          mkdir "$RUNNER_TEMP/sdk-e2e"
          cp tests/release/sdk.mjs "$RUNNER_TEMP/sdk-e2e/sdk.mjs"
          cd "$RUNNER_TEMP/sdk-e2e"
          npm init --yes >/dev/null
          npm install --ignore-scripts --save-exact "$sdk" @aexhq/loop-pi@0.89.0
          npm audit --audit-level=high
      - name: Run the candidate image through the staged SDK
        shell: bash
        env:
          BRAIN_API_TOKEN: release-sdk-token
        run: |
          set -euo pipefail
          image=$(jq -er '"\(.image)@\(.manifest_digest)"' "$RUNNER_TEMP/brain-release/brain-image.json")
          docker pull "$image" >/dev/null
          docker run -d --name brain-sdk-e2e -p 18080:8080 -e BRAIN_API_TOKEN "$image"
          trap 'docker logs brain-sdk-e2e; docker rm -f brain-sdk-e2e >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready >/dev/null; then break; fi
            test "$attempt" -lt 60
            sleep 1
          done
          BRAIN_BASE_URL=http://127.0.0.1:18080 node "$RUNNER_TEMP/sdk-e2e/sdk.mjs"

  e2e-http:
    if: inputs.operation == 'stage'
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: brain-npm-release-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/brain-release
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare the raw HTTP client and deployed journal shape
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/http-e2e" "$RUNNER_TEMP/http-data"
          cp tests/release/http.mjs "$RUNNER_TEMP/http-e2e/http.mjs"
          cd "$RUNNER_TEMP/http-e2e"
          npm init --yes >/dev/null
          npm install --ignore-scripts --save-exact @aexhq/loop-pi@0.89.0
          npm audit --audit-level=high
          python3 - "$RUNNER_TEMP/http-data/brain.sqlite3" <<'PY'
          import sqlite3
          import sys
          connection = sqlite3.connect(sys.argv[1])
          connection.execute("""CREATE TABLE sessions (
            session_id TEXT PRIMARY KEY,
            journal_id TEXT NOT NULL,
            status TEXT NOT NULL,
            through_sequence INTEGER NOT NULL,
            configuration_json TEXT NOT NULL,
            context_json TEXT NOT NULL,
            presentation_digest TEXT NOT NULL,
            metadata_json TEXT NOT NULL
          )""")
          connection.close()
          PY
          sudo chown -R 10001:10001 "$RUNNER_TEMP/http-data"
      - name: Run the candidate image through raw HTTP after an in-place upgrade
        shell: bash
        env:
          BRAIN_API_TOKEN: release-http-token
        run: |
          set -euo pipefail
          image=$(jq -er '"\(.image)@\(.manifest_digest)"' "$RUNNER_TEMP/brain-release/brain-image.json")
          docker pull "$image" >/dev/null
          docker run -d --name brain-http-e2e -p 18081:8080 -e BRAIN_API_TOKEN \
            -v "$RUNNER_TEMP/http-data:/var/lib/brain" "$image"
          trap 'docker logs brain-http-e2e; docker rm -f brain-http-e2e >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18081/health/ready >/dev/null; then break; fi
            test "$attempt" -lt 60
            sleep 1
          done
          BRAIN_BASE_URL=http://127.0.0.1:18081 node "$RUNNER_TEMP/http-e2e/http.mjs"

  e2e-contracts:
    if: inputs.operation == 'stage'
    needs: stage
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sdk-turns
            script: sdk-turns.mjs
            port: 18082
          - name: sdk-events
            script: sdk-events.mjs
            port: 18083
          - name: http-contract
            script: http-contract.mjs
            port: 18084
    name: e2e-${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: brain-npm-release-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/brain-release
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Build the diagnostic Agentloop with the staged SDK
        shell: bash
        env:
          TEST_SCRIPT: ${{ matrix.script }}
        run: |
          set -euo pipefail
          sdk=$(jq -er '.packages[] | select(.name == "@aexhq/brain") | "\(.name)@\(.version)"' "$RUNNER_TEMP/brain-release/manifest.json")
          test "$(npm view "$sdk" version)" = "${sdk##*@}"
          mkdir "$RUNNER_TEMP/contract-e2e"
          cp "tests/release/$TEST_SCRIPT" tests/release/diagnostic-loop.mjs "$RUNNER_TEMP/contract-e2e/"
          cd "$RUNNER_TEMP/contract-e2e"
          npm init --yes >/dev/null
          npm install --ignore-scripts --save-exact "$sdk" @aexhq/agentloop@0.4.1
          npx brain-loop build diagnostic-loop.mjs --out diagnostic.brain.json
          npm audit --audit-level=high
      - name: Run ${{ matrix.name }} against the candidate
        shell: bash
        env:
          BRAIN_API_TOKEN: release-contract-token
          TEST_PORT: ${{ matrix.port }}
          TEST_SCRIPT: ${{ matrix.script }}
        run: |
          set -euo pipefail
          image=$(jq -er '"\(.image)@\(.manifest_digest)"' "$RUNNER_TEMP/brain-release/brain-image.json")
          docker pull "$image" >/dev/null
          docker run -d --name "brain-${{ matrix.name }}-e2e" -p "$TEST_PORT:8080" -e BRAIN_API_TOKEN "$image"
          trap 'docker logs "brain-${{ matrix.name }}-e2e"; docker rm -f "brain-${{ matrix.name }}-e2e" >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:$TEST_PORT/health/ready" >/dev/null; then break; fi
            test "$attempt" -lt 60
            sleep 1
          done
          BRAIN_BASE_URL="http://127.0.0.1:$TEST_PORT" node "$RUNNER_TEMP/contract-e2e/$TEST_SCRIPT"

  stage-gate:
    if: always() && inputs.operation == 'stage'
    needs: [stage, e2e-sdk, e2e-http, e2e-contracts]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every candidate interface
        env:
          STAGE: ${{ needs.stage.result }}
          SDK: ${{ needs.e2e-sdk.result }}
          HTTP: ${{ needs.e2e-http.result }}
          CONTRACTS: ${{ needs.e2e-contracts.result }}
        run: |
          test "$STAGE" = success
          test "$SDK" = success
          test "$HTTP" = success
          test "$CONTRACTS" = success

  promote:
    if: inputs.operation == 'promote'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-production
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: brain-npm-release-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/brain-npm-release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.stage_run_id }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use the npm version pinned for promotion
        run: npm install --global npm@11.19.0
      - name: Promote the already-staged archives without republishing
        shell: bash
        env:
          # OIDC trusted publishing cannot mutate dist-tags. Keep this granular token scoped to
          # this package and protected by the reviewed npm-production environment.
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
        run: node "$RUNNER_TEMP/brain-npm-release/publish.mjs" promote
      - name: Record promoted versions
        shell: bash
        run: |
          versions=$(node "$RUNNER_TEMP/brain-npm-release/npm-release.mjs" versions "$RUNNER_TEMP/brain-npm-release/manifest.json")
          echo "Promoted the same registry objects to npm dist-tag \`latest\`: \`$versions\`" >> "$GITHUB_STEP_SUMMARY"

  promote-image:
    if: inputs.operation == 'promote'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-production
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: brain-npm-release-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/brain-release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.stage_run_id }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the tested manifest
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/brain-release/brain-image.json"
          test "$(jq -er .source_sha "$manifest")" = "$EXPECTED_COMMIT"
          image=$(jq -er .image "$manifest")
          digest=$(jq -er .manifest_digest "$manifest")
          docker buildx imagetools inspect "$image@$digest" >/dev/null
          docker buildx imagetools create -t "$image:latest" "$image@$digest"
          promoted=$(docker buildx imagetools inspect "$image:latest" --format '{{json .Manifest}}' | jq -er .digest)
          test "$promoted" = "$digest"
          echo "Promoted the tested image to \`$image:latest\` at \`$image@$digest\`." >> "$GITHUB_STEP_SUMMARY"
