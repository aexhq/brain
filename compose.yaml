name: brain

services:
  server:
    build:
      context: .
    image: ${BRAIN_SERVER_IMAGE:-brain:local}
    restart: unless-stopped
    environment:
      # journal log and local session storage under BRAIN_DATA_DIR.
      BRAIN_LISTEN: 0.0.0.0:8080
      BRAIN_DATA_DIR: /var/lib/brain
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - type: bind
        source: ${BRAIN_DATA_DIR:?set BRAIN_DATA_DIR to an absolute host path}
        target: /var/lib/brain
