openapi: 3.1.0
info:
  title: Brain HTTP API
  version: 1.0.0
paths:
  /v1/agentloops:
    post:
      operationId: admitAgentloop
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 33554432 }
      responses:
        '200':
          description: Agentloop admitted
          content:
            application/json:
              schema: { $ref: './schemas.json#/$defs/AgentloopAdmission' }
        default: { $ref: '#/components/responses/Error' }
  /v1/agentloops/{identity}:
    get:
      operationId: getAgentloop
      parameters:
        - name: identity
          in: path
          required: true
          schema: { $ref: './schemas.json#/$defs/Identity' }
      responses:
        '200':
          description: Admission status
          content:
            application/json:
              schema: { $ref: './schemas.json#/$defs/AgentloopAdmission' }
        default: { $ref: '#/components/responses/Error' }
  /v1/environments:
    post:
      operationId: createEnvironment
      description: >-
        Creates an environment: Brain runs its setup and keeps what it declared it
        executes and offers. Sessions attach to it by id. A managed environment is
        closed by Brain once no session has been attached to it for its idle TTL; an
        unmanaged one lives until it is deleted.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas.json#/$defs/CreateEnvironmentRequest' }
      responses:
        '200':
          description: Created environment
          content:
            application/json:
              schema: { $ref: './schemas.json#/$defs/Environment' }
        default: { $ref: '#/components/responses/Error' }
    get:
      operationId: listEnvironments
      responses:
        '200':
          description: Environments
          content:
            application/json:
              schema: { $ref: './schemas.json#/$defs/EnvironmentList' }
        default: { $ref: '#/components/responses/Error' }
  /v1/environments/{environment_id}:
    parameters:
      - name: environment_id
        in: path
        required: true
        schema: { $ref: './schemas.json#/$defs/Identifier' }
    get:
      operationId: getEnvironment
      responses:
        '200':
          description: Environment state
          content:
            application/json:
              schema: { $ref: './schemas.json#/$defs/Environment' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteEnvironment
      description: >-
        Tears the environment down. Refused with `conflict` while a session is still
        attached; every session that was ever attached sees `environment_closed` on its
        events.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Closed }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions:
    post:
      operationId: createSession
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas.json#/$defs/CreateSessionRequest' }
      responses:
        '200':
          description: Created session
          content:
            application/json:
              schema: { $ref: './schemas.json#/$defs/Session' }
        default: { $ref: '#/components/responses/Error' }
    get:
      operationId: listSessions
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema: { $ref: './schemas.json#/$defs/SessionList' }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSession
      responses:
        '200':
          description: Session state
          content:
            application/json:
              schema: { $ref: './schemas.json#/$defs/Session' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteSession
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{session_id}/messages:
    post:
      operationId: sendMessage
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas.json#/$defs/MessageRequest' }
      responses:
        '200':
          description: Updated session
          content:
            application/json:
              schema: { $ref: './schemas.json#/$defs/Session' }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{session_id}/environments/{environment_id}/calls/{name}:
    post:
      operationId: callEnvironment
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: environment_id
          in: path
          required: true
          schema: { $ref: './schemas.json#/$defs/Identifier' }
        - name: name
          in: path
          required: true
          schema: { $ref: './schemas.json#/$defs/Identifier' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas.json#/$defs/EnvironmentCallRequest' }
      responses:
        '200':
          description: Environment method result
          content:
            application/json:
              schema: { $ref: './schemas.json#/$defs/EnvironmentCallResult' }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{session_id}/serve:
    get:
      operationId: serveSessionTools
      description: >-
        The serve feed: an SSE stream of this session's client-hosted
        `tool_call_started` and `tool_cancel_started` records, filtered to the tools
        named in `tools`, plus `session_ended`. It opens with the still-pending backlog
        (calls with no finished record) and then carries records as they are appended. Authorized
        by the session's share key as a bearer token (the API token also works). One
        live consumer per tool: a new connection claiming a tool displaces the
        stream that held it, so a reconnecting client replaces its own dead
        connection instead of racing it.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: tools
          in: query
          required: true
          description: Comma-separated client-hosted tool names this connection serves.
          schema: { type: string, minLength: 1, maxLength: 4096 }
        - name: after
          in: query
          description: >-
            Resume cursor. Absent, the stream opens with the pending backlog; set,
            it replays every matching record after this sequence instead.
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Live serve stream
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{session_id}/tool-results/{sequence}:
    post:
      operationId: resolveToolCall
      description: >-
        Answers a client-hosted tool call. The call is named by the sequence of its
        `tool_call_started` record on the event feed; the body is the call's outcome.
        Idempotent per call: a retry with the same key replays the first answer, and a
        call that is no longer pending is a conflict. Authorized by the API token or by
        the session's share key.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: sequence
          in: path
          required: true
          schema: { $ref: './schemas.json#/$defs/Sequence' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas.json#/$defs/Outcome' }
      responses:
        '204': { description: Outcome recorded }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{session_id}/cancel:
    post:
      operationId: cancelSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Cancellation requested }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{session_id}/events:
    get:
      operationId: readSessionEvents
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: after
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: >-
            A finite event page for application/json, or a live SSE stream for
            text/event-stream. The stream begins with the page `after` names and then
            carries records as they are appended, so a client that opens it before
            sending a message sees that turn. It ends if the subscriber falls too far
            behind: reconnect with `after` set to the last id seen, and the journal
            hands back exactly what was missed.
          content:
            application/json:
              schema: { $ref: './schemas.json#/$defs/EventPage' }
            text/event-stream:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{session_id}/end:
    post:
      operationId: endSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Ended session
          content:
            application/json:
              schema: { $ref: './schemas.json#/$defs/Session' }
        default: { $ref: '#/components/responses/Error' }
  /health/live:
    get:
      operationId: live
      responses:
        '204': { description: Process is live }
  /health/ready:
    get:
      operationId: ready
      responses:
        '204': { description: Process is ready }
        '503': { description: Required dependency is unavailable }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { $ref: './schemas.json#/$defs/SessionId' }
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema: { $ref: './schemas.json#/$defs/ApiError' }
