openapi: 3.1.0
info:
  title: Brain HTTP API
  version: 1.0.0
paths:
  /v1/agentloops:
    post:
      operationId: admitAgentloop
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, maxLength: 33554432 }
      responses:
        '200':
          description: Agentloop admitted
          content:
            application/json:
              schema: { $ref: './schemas.json#/$defs/AgentloopAdmission' }
        default: { $ref: '#/components/responses/Error' }
  /v1/agentloops/{digest}:
    get:
      operationId: getAgentloop
      parameters:
        - name: digest
          in: path
          required: true
          schema: { $ref: './schemas.json#/$defs/Digest' }
      responses:
        '200':
          description: Admission status
          content:
            application/json:
              schema: { $ref: './schemas.json#/$defs/AgentloopAdmission' }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions:
    post:
      operationId: createSession
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas.json#/$defs/CreateSessionRequest' }
      responses:
        '200':
          description: Created session
          content:
            application/json:
              schema: { $ref: './schemas.json#/$defs/Session' }
        default: { $ref: '#/components/responses/Error' }
    get:
      operationId: listSessions
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema: { $ref: './schemas.json#/$defs/SessionList' }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSession
      responses:
        '200':
          description: Session state
          content:
            application/json:
              schema: { $ref: './schemas.json#/$defs/Session' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteSession
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{session_id}/messages:
    post:
      operationId: sendMessage
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas.json#/$defs/MessageRequest' }
      responses:
        '200':
          description: Updated session
          content:
            application/json:
              schema: { $ref: './schemas.json#/$defs/Session' }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{session_id}/environments/{environment_id}/calls/{name}:
    post:
      operationId: callEnvironment
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: environment_id
          in: path
          required: true
          schema: { $ref: './schemas.json#/$defs/Identifier' }
        - name: name
          in: path
          required: true
          schema: { $ref: './schemas.json#/$defs/Identifier' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas.json#/$defs/EnvironmentCallRequest' }
      responses:
        '200':
          description: Environment method result
          content:
            application/json:
              schema: { $ref: './schemas.json#/$defs/EnvironmentCallResult' }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{session_id}/cancel:
    post:
      operationId: cancelSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Cancellation requested }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{session_id}/events:
    get:
      operationId: readSessionEvents
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: after
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Finite event page or SSE stream according to Accept
          content:
            application/json:
              schema: { $ref: './schemas.json#/$defs/EventPage' }
            text/event-stream:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /v1/sessions/{session_id}/end:
    post:
      operationId: endSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Ended session
          content:
            application/json:
              schema: { $ref: './schemas.json#/$defs/Session' }
        default: { $ref: '#/components/responses/Error' }
  /health/live:
    get:
      operationId: live
      responses:
        '204': { description: Process is live }
  /health/ready:
    get:
      operationId: ready
      responses:
        '204': { description: Process is ready }
        '503': { description: Required dependency is unavailable }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { $ref: './schemas.json#/$defs/SessionId' }
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema: { $ref: './schemas.json#/$defs/ApiError' }
