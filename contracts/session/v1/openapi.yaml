components:
  schemas:
    AdmissionStatus:
      enum:
      - admitted
      - rejected
      type: string
    AgentloopAdmission:
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
        identity:
          $ref: '#/components/schemas/AgentloopIdentity'
        status:
          $ref: '#/components/schemas/AdmissionStatus'
      required:
      - identity
      - status
      type: object
    AgentloopIdentity:
      pattern: ^[0-9a-f]{64}$
      type: string
    AgentloopRef:
      additionalProperties: false
      description: 'The admitted loop package a session runs: which one, and how it is configured.'
      properties:
        configuration: true
        environment_id:
          $ref: '#/components/schemas/EnvironmentId'
          description: |-
            The Environment that executes this Agentloop. The MVP supports Brain's native
            Wasmtime Environment; the binding stays explicit for later drivers.
        identity:
          $ref: '#/components/schemas/AgentloopIdentity'
      required:
      - identity
      - configuration
      - environment_id
      type: object
    ApiError:
      properties:
        code:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          type: string
        details: true
        message:
          maxLength: 4096
          minLength: 1
          type: string
        retryable:
          type: boolean
      required:
      - code
      - message
      - retryable
      type: object
    BindingValues:
      additionalProperties:
        maxLength: 32768
        type: string
      propertyNames:
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        type: string
      type: object
    BoundTool:
      additionalProperties: false
      allOf:
      - if:
          properties:
            hosting:
              const: resident
          required:
          - hosting
        then:
          allOf:
          - required:
            - host_id
          - not:
              required:
              - implementation
          - not:
              required:
              - environment_id
          - properties:
              needs:
                maxItems: 0
      - if:
          not:
            properties:
              hosting:
                const: resident
            required:
            - hosting
        then:
          allOf:
          - required:
            - environment_id
            - implementation
          - not:
              required:
              - host_id
      description: |-
        One tool as the SDK hands it over: its manifest fields plus the environment it
        binds to. Brain splits the model-facing and dispatch-facing halves internally.
      properties:
        binding_names:
          items:
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
            type: string
          maxItems: 64
          type: array
          uniqueItems: true
        description:
          maxLength: 8192
          type: string
        environment_id:
          $ref: '#/components/schemas/EnvironmentId'
          description: Required for a provisioned tool; a resident tool binds no Environment.
        host_id:
          $ref: '#/components/schemas/HostId'
          description: Required for a resident tool and absent for a provisioned tool.
        hosting:
          $ref: '#/components/schemas/ToolHosting'
          default: provisioned
        implementation: true
        input_schema:
          type: object
        name:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          type: string
        needs:
          default: []
          items:
            pattern: ^[a-z][a-z0-9_]{0,63}(:[A-Za-z0-9._-]{1,64})?$
            type: string
          maxItems: 64
          type: array
          uniqueItems: true
        output_schema:
          type: object
      required:
      - name
      - description
      - input_schema
      - binding_names
      type: object
    ContentBlock:
      oneOf:
      - additionalProperties: false
        properties:
          text:
            type: string
          type:
            const: text
            type: string
        required:
        - type
        - text
        type: object
      - additionalProperties: false
        properties:
          id:
            type: string
          input: true
          name:
            type: string
          type:
            const: tool_use
            type: string
        required:
        - type
        - id
        - name
        - input
        type: object
      - additionalProperties: false
        properties:
          content: true
          is_error:
            description: |-
              ALWAYS set on a failed tool. Omitting the flag on a failure lets the
              model read that failure as a success.
            type: boolean
          tool_use_id:
            type: string
          type:
            const: tool_result
            type: string
        required:
        - type
        - tool_use_id
        - content
        - is_error
        type: object
    CreateSessionRequest:
      additionalProperties: false
      properties:
        agentloop:
          $ref: '#/components/schemas/AgentloopRef'
        environments:
          description: Immutable Environment specifications opened and attached as part of this create.
          items:
            $ref: '#/components/schemas/SessionEnvironment'
          maxItems: 128
          type: array
        idle_ttl_ms:
          description: |-
            How long the session may sit idle before Brain suspends it: its task and memory
            are released and rebuilt from disk on the next request. Absent means the server's
            default; zero means never.
          format: uint64
          minimum: 0
          type: integer
        model:
          $ref: '#/components/schemas/ModelSelection'
        response_format:
          description: |-
            The provider's structured-output request, applied to every model call unless the
            loop sends its own. Optional, and rejected at create for a provider that cannot
            carry it.
        system:
          default: ''
          description: |-
            The system prompt the agent loop starts from. The loop may send a different one
            on any model call.
          maxLength: 131072
          type: string
        tools:
          items:
            $ref: '#/components/schemas/BoundTool'
          maxItems: 128
          type: array
        transcript:
          description: |-
            A transcript to carry forward, if the caller has one: the messages the new
            session's first model call should already see. Brain journals them as the session's
            opening transcript. Empty is an ordinary new session.
          items:
            $ref: '#/components/schemas/Message'
          maxItems: 4096
          type: array
      required:
      - agentloop
      - model
      - tools
      - environments
      type: object
    EnvironmentCallRequest:
      additionalProperties: false
      properties:
        input: true
      required:
      - input
      type: object
    EnvironmentCallResult:
      additionalProperties: false
      properties:
        output: true
      required:
      - output
      type: object
    EnvironmentId:
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
      type: string
    Event:
      properties:
        data: true
        event_id:
          $ref: '#/components/schemas/EventId'
        event_type:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          type: string
        recorded_at_ms:
          format: uint64
          minimum: 0
          type: integer
        sequence:
          format: uint64
          minimum: 1
          type: integer
      required:
      - event_id
      - sequence
      - recorded_at_ms
      - event_type
      - data
      type: object
    EventId:
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
      type: string
    EventPage:
      properties:
        events:
          items:
            $ref: '#/components/schemas/Event'
          maxItems: 1000
          type: array
        next_cursor:
          format: uint64
          minimum: 0
          type: integer
      required:
      - events
      - next_cursor
      type: object
    HostCommand:
      properties:
        deadline_at_ms:
          format: uint64
          minimum: 0
          type: integer
        operation:
          $ref: '#/components/schemas/HostOperation'
        sequence:
          format: uint64
          minimum: 1
          type: integer
        session_id:
          $ref: '#/components/schemas/SessionId'
      required:
      - session_id
      - sequence
      - deadline_at_ms
      - operation
      type: object
    HostEvent:
      additionalProperties: false
      properties:
        data: true
        event_type:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          type: string
        sequence:
          description: The resident command this Event belongs to.
          format: uint64
          minimum: 1
          type: integer
        session_id:
          $ref: '#/components/schemas/SessionId'
      required:
      - session_id
      - sequence
      - event_type
      - data
      type: object
    HostEventAck:
      properties:
        sequence:
          description: The sequence Brain assigned to the committed Event.
          format: uint64
          minimum: 1
          type: integer
      required:
      - sequence
      type: object
    HostId:
      pattern: ^host_[A-Za-z0-9]{20,32}$
      type: string
    HostOperation:
      oneOf:
      - properties:
          invocation:
            $ref: '#/components/schemas/ToolInvocation'
          type:
            const: invoke_tool
            type: string
        required:
        - type
        - invocation
        type: object
      - properties:
          target_sequence:
            format: uint64
            minimum: 0
            type: integer
          type:
            const: cancel_tool
            type: string
        required:
        - type
        - target_sequence
        type: object
    HostRegistration:
      properties:
        host_id:
          $ref: '#/components/schemas/HostId'
        token:
          type: string
      required:
      - host_id
      - token
      type: object
    HostResult:
      additionalProperties: false
      properties:
        outcome:
          $ref: '#/components/schemas/Outcome'
        sequence:
          format: uint64
          minimum: 1
          type: integer
        session_id:
          $ref: '#/components/schemas/SessionId'
      required:
      - session_id
      - sequence
      - outcome
      type: object
    Identity:
      pattern: ^[0-9a-f]{64}$
      type: string
    Message:
      additionalProperties: false
      properties:
        content:
          items:
            $ref: '#/components/schemas/ContentBlock'
          type: array
        role:
          $ref: '#/components/schemas/Role'
      required:
      - role
      - content
      type: object
    MessageRequest:
      additionalProperties: false
      properties:
        input:
          $ref: '#/components/schemas/UserInput'
      required:
      - input
      type: object
    ModelSelection:
      additionalProperties: false
      properties:
        api_key:
          maxLength: 16384
          minLength: 1
          type: string
        name:
          maxLength: 256
          pattern: ^\S{1,256}$
          type: string
        provider:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          type: string
      required:
      - provider
      - name
      - api_key
      type: object
    Outcome:
      description: |-
        The one envelope every tool invocation resolves to.

        `timeout` is distinguished from `error` because the deadline is caller-owned: no
        backend family can be trusted to enforce one remotely, so the caller kills and says
        exactly what happened rather than encoding it as an exit code.
      oneOf:
      - properties:
          status:
            const: ok
            type: string
          value: true
        required:
        - status
        - value
        type: object
      - properties:
          error:
            $ref: '#/components/schemas/OutcomeError'
          status:
            const: error
            type: string
        required:
        - status
        - error
        type: object
      - properties:
          status:
            const: timeout
            type: string
        required:
        - status
        type: object
      - properties:
          status:
            const: cancelled
            type: string
        required:
        - status
        type: object
      - properties:
          message:
            type: string
          status:
            const: unknown
            type: string
        required:
        - status
        - message
        type: object
    OutcomeError:
      additionalProperties: false
      properties:
        code:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          type: string
        details: true
        message:
          maxLength: 4096
          type: string
      required:
      - code
      - message
      type: object
    Role:
      enum:
      - user
      - assistant
      type: string
    SessionEnvironment:
      additionalProperties: false
      description: |-
        One immutable Environment specification in a session create. `bindings` carries
        plaintext values only until attach and is never copied into the session journal.
      properties:
        bindings:
          $ref: '#/components/schemas/BindingValues'
          default: {}
        configuration: true
        environment_id:
          $ref: '#/components/schemas/EnvironmentId'
        idle_ttl_ms:
          format: uint64
          minimum: 0
          type: integer
        managed:
          default: false
          type: boolean
      required:
      - environment_id
      - configuration
      type: object
    SessionId:
      pattern: ^ses_[A-Za-z0-9]{20,32}$
      type: string
    SessionList:
      properties:
        sessions:
          items:
            $ref: '#/components/schemas/SessionSummary'
          type: array
      required:
      - sessions
      type: object
    SessionStatus:
      enum:
      - creating
      - idle
      - running
      - ended
      - failed
      type: string
    SessionSummary:
      description: 'What the API says about a session: its id, where it is, and how far its journal goes.'
      properties:
        last_sequence:
          description: |-
            Sequence of the last journal record committed for this session — the journal is
            complete through here, so it is where a `GET /events` cursor starts.
          format: uint64
          minimum: 0
          type: integer
        session_id:
          $ref: '#/components/schemas/SessionId'
        status:
          $ref: '#/components/schemas/SessionStatus'
      required:
      - session_id
      - status
      - last_sequence
      type: object
    ToolAdmission:
      properties:
        error:
          $ref: '#/components/schemas/TurnError'
        identity:
          $ref: '#/components/schemas/ToolIdentity'
        status:
          $ref: '#/components/schemas/ToolAdmissionStatus'
      required:
      - identity
      - status
      type: object
    ToolAdmissionStatus:
      enum:
      - admitted
      - rejected
      type: string
    ToolHosting:
      description: |-
        Where a tool's implementation executes: a placed implementation in an Environment,
        or a function held by a registered application host.
      enum:
      - provisioned
      - resident
      type: string
    ToolIdentity:
      pattern: ^[0-9a-f]{64}$
      type: string
    ToolInvocation:
      properties:
        call_id:
          type: string
        input: true
        name:
          type: string
      required:
      - call_id
      - name
      - input
      type: object
    TurnError:
      description: Why a turn, or one of the host calls inside it, failed.
      properties:
        code:
          maxLength: 128
          minLength: 1
          type: string
        message:
          maxLength: 4096
          minLength: 1
          type: string
        retryable:
          default: false
          type: boolean
      required:
      - code
      - message
      type: object
    UserInput:
      additionalProperties: false
      description: |-
        What an application hands a session on `send`. The shape is closed on purpose:
        Brain owes every agentloop the same observation shape regardless of who wrote
        the client, so free-form content is not accepted. Multimodal parts will extend
        this record when they land — see the roadmap.
      properties:
        message:
          minLength: 1
          type: string
      required:
      - message
      type: object
info:
  description: Versioned Brain HTTP transport
  license:
    identifier: MIT
    name: MIT
  title: Brain HTTP API
  version: 1.0.0
openapi: 3.1.0
paths:
  /health/live:
    get:
      operationId: live
      responses:
        '204':
          description: Process is live
  /health/ready:
    get:
      operationId: ready
      responses:
        '204':
          description: Process is ready
        '503':
          description: Required dependency is unavailable
  /v1/agentloops:
    post:
      operationId: admitAgentloop
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 256
          minLength: 1
          type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              maxLength: 33554432
              type: string
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentloopAdmission'
          description: Agentloop admitted
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Structured error
  /v1/agentloops/{identity}:
    get:
      operationId: getAgentloop
      parameters:
      - in: path
        name: identity
        required: true
        schema:
          $ref: '#/components/schemas/AgentloopIdentity'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentloopAdmission'
          description: Admission status
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Structured error
  /v1/hosts:
    post:
      operationId: registerHost
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostRegistration'
          description: Registered resident extension host
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Structured error
  /v1/hosts/{host_id}/commands:
    get:
      operationId: hostCommands
      parameters:
      - in: path
        name: host_id
        required: true
        schema:
          $ref: '#/components/schemas/HostId'
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
          description: Bounded send-once resident command stream
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Structured error
  /v1/hosts/{host_id}/events:
    post:
      operationId: emitHostEvent
      parameters:
      - in: path
        name: host_id
        required: true
        schema:
          $ref: '#/components/schemas/HostId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostEvent'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostEventAck'
          description: Resident extension Event committed
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Structured error
  /v1/hosts/{host_id}/results:
    post:
      operationId: resolveHostCommand
      parameters:
      - in: path
        name: host_id
        required: true
        schema:
          $ref: '#/components/schemas/HostId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostResult'
        required: true
      responses:
        '204':
          description: Resident command result accepted
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Structured error
  /v1/sessions:
    get:
      operationId: listSessions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
          description: Sessions
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Structured error
    post:
      operationId: createSession
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 256
          minLength: 1
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSummary'
          description: Created session
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Structured error
  /v1/sessions/{session_id}:
    delete:
      operationId: deleteSession
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          $ref: '#/components/schemas/SessionId'
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 256
          minLength: 1
          type: string
      responses:
        '204':
          description: Deleted
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Structured error
    get:
      operationId: getSession
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          $ref: '#/components/schemas/SessionId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSummary'
          description: Session state
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Structured error
  /v1/sessions/{session_id}/cancel:
    post:
      operationId: cancelSession
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          $ref: '#/components/schemas/SessionId'
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 256
          minLength: 1
          type: string
      responses:
        '204':
          description: Cancellation requested
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Structured error
  /v1/sessions/{session_id}/end:
    post:
      operationId: endSession
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          $ref: '#/components/schemas/SessionId'
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 256
          minLength: 1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSummary'
          description: Ended session
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Structured error
  /v1/sessions/{session_id}/environments/{environment_id}/calls/{name}:
    post:
      operationId: callEnvironment
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          $ref: '#/components/schemas/SessionId'
      - in: path
        name: environment_id
        required: true
        schema:
          $ref: '#/components/schemas/EnvironmentId'
      - in: path
        name: name
        required: true
        schema:
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          type: string
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 256
          minLength: 1
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentCallRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentCallResult'
          description: Environment method result
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Structured error
  /v1/sessions/{session_id}/events:
    get:
      operationId: readSessionEvents
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          $ref: '#/components/schemas/SessionId'
      - in: query
        name: after
        required: false
        schema:
          format: int64
          minimum: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
            text/event-stream:
              schema:
                type: string
          description: 'A finite event page for application/json, or a live SSE stream for text/event-stream. The stream begins with the page `after` names and then carries records as they are appended, so a client that opens it before sending a message sees that turn. It ends if the subscriber falls too far behind: reconnect with `after` set to the last id seen, and the journal hands back exactly what was missed.'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Structured error
  /v1/sessions/{session_id}/messages:
    post:
      operationId: sendMessage
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          $ref: '#/components/schemas/SessionId'
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 256
          minLength: 1
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
        required: true
      responses:
